name: Go CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go/go.mod

    - name: Vet
      working-directory: go
      run: go vet ./...

    - name: Build
      working-directory: go
      run: go build ./...

    - name: Test
      working-directory: go
      run: go test ./... -v
